[package]
name = "git-sync-submodule-refs"
version = "0.1.1"
edition = "2024"
license = "MIT"
authors = ["Klevis Imeri"]
description = "Safely commit and push recursive Git submodule reference updates"
repository = "https://github.com/KlevisImeri/git-sync-submodule-refs"

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[dependencies]
anyhow = "1"
bstr = { version = "1", default-features = false, features = ["std"] }
git-spawn = "0.4"
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
